<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Player Snake Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🐍 Two Player Snake Game 🐍</h1>
        <div class="scores">
          <div class="score-box player1">
            <span class="player-label">Player 1 (ASWD)</span>
            <span class="score-value" id="score1">0</span>
            <span class="length-value"
              >Length: <span id="length1">1</span></span
            >
          </div>
          <div class="score-box player2">
            <span class="player-label">Player 2 (Arrows)</span>
            <span class="score-value" id="score2">0</span>
            <span class="length-value"
              >Length: <span id="length2">1</span></span
            >
          </div>
        </div>
      </div>

      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <div class="controls">
        <div class="player-controls">
          <h3>Player 1 Controls</h3>
          <p><strong>W</strong> - Up</p>
          <p><strong>S</strong> - Down</p>
          <p><strong>A</strong> - Left</p>
          <p><strong>D</strong> - Right</p>
        </div>
        <div class="player-controls">
          <h3>Player 2 Controls</h3>
          <p><strong>↑</strong> - Up</p>
          <p><strong>↓</strong> - Down</p>
          <p><strong>←</strong> - Left</p>
          <p><strong>→</strong> - Right</p>
        </div>
      </div>

      <div class="game-status">
        <button id="startBtn" class="btn btn-start">Start Game</button>
        <button id="resetBtn" class="btn btn-reset" style="display: none">
          Reset Game
        </button>
        <p id="gameMessage" class="message"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
